
services:
  backend:
    build: .
    command: >
      python -m uvicorn backend.app.main:aplicacion
      --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/proyecto/data
    restart: unless-stopped

  frontend:
    build: .
    command: >
      python -m streamlit run frontend/app.py
      --server.address 0.0.0.0
      --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - DIRECCION_API=http://backend:8000
    restart: unless-stopped
